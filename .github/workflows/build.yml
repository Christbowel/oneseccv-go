name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:

  # ─────────────────────────────────────────────────────
  # WINDOWS — EXE portable uniquement
  # ─────────────────────────────────────────────────────
  build-windows:
    name: Windows (EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build EXE
        run: wails build -platform windows/amd64

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: OneSecCV-Windows
          path: build\bin\OneSecCV.exe

  # ─────────────────────────────────────────────────────
  # LINUX
  # ─────────────────────────────────────────────────────
  build-linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            pkg-config \
            build-essential \
            libayatana-appindicator3-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build Linux binary
        run: wails build -platform linux/amd64

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: OneSecCV-Linux
          path: build/bin/OneSecCV

  # ─────────────────────────────────────────────────────
  # MACOS
  # ─────────────────────────────────────────────────────
  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build macOS app
        run: wails build -platform darwin/universal

      - name: Zip .app bundle
        run: |
          cd build/bin
          zip -r OneSecCV-macOS.zip OneSecCV.app

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: OneSecCV-macOS
          path: build/bin/OneSecCV-macOS.zip

  # ─────────────────────────────────────────────────────
  # RELEASE
  # ─────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "OneSecCV ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## OneSecCV ${{ github.ref_name }}

            AI-Powered CV Generator — Built with Go, Wails & React.

            ### Downloads

            | Platform | File | Notes |
            |---|---|---|
            | 🪟 Windows | `OneSecCV.exe` | Portable — no installation needed |
            | 🐧 Linux | `OneSecCV` | Requires TeX Live: `sudo apt install texlive-full` |
            | 🍎 macOS | `OneSecCV-macOS.zip` | Requires MacTeX: https://tug.org/mactex/ |

            ### Requirements
            - A free Google AI API key from [aistudio.google.com](https://aistudio.google.com/app/apikey)
            - MiKTeX (Windows) or TeX Live (Linux/Mac) for PDF compilation

            ### Privacy
            All data is processed locally. Your API key is stored on your machine only.

          files: |
            artifacts/OneSecCV-Windows/OneSecCV.exe
            artifacts/OneSecCV-Linux/OneSecCV
            artifacts/OneSecCV-macOS/OneSecCV-macOS.zip