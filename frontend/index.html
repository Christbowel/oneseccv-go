<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach under the iOS notch; the app
         pads itself back with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>OneSecCV — a recruiter-ready CV in one second</title>
    <meta name="description" content="Paste the job offer, drop your old CV, and get a typeset LaTeX PDF tailored to that role. Free, ATS-friendly, works on mobile." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#050810" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OneSecCV" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OneSecCV — a recruiter-ready CV in one second" />
    <meta property="og:description" content="Paste the job offer, drop your old CV, get a typeset LaTeX PDF aimed at that role." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
